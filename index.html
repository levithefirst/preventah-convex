<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#C9B6EA" />
    <meta name="color-scheme" content="light" />

    <!-- Per-route title, description, canonical and og:url are set by
         src/router.ts on navigation. These are the defaults a crawler
         sees before hydration, and the values for "/". -->
    <title>Preventah — prevent the diseases that run in your family</title>
    <meta
      name="description"
      content="Pick the conditions that run in your family. Preventah gives you something concrete to do today, and the people you live with see that you did it."
    />
    <link rel="canonical" href="https://qualified-hummingbird-614.convex.site/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Preventah" />
    <meta property="og:title" content="Preventah — prevent the diseases that run in your family" />
    <meta
      property="og:description"
      content="Pick the conditions that run in your family. Something concrete to do today, and a household that sees you did it."
    />
    <meta property="og:url" content="https://qualified-hummingbird-614.convex.site/" />
    <meta property="og:image" content="https://qualified-hummingbird-614.convex.site/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Preventah: prevent the diseases that run in your family." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://qualified-hummingbird-614.convex.site/og.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- The two vendored faces, fetched from this origin. Preloaded so the
         title face is ready before first paint and does not shift. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/figtree.woff2" crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Preventah",
            "url": "https://qualified-hummingbird-614.convex.site",
            "description": "Prevent the diseases that run in your family."
          },
          {
            "@type": "Organization",
            "name": "Preventah",
            "url": "https://qualified-hummingbird-614.convex.site",
            "logo": "https://qualified-hummingbird-614.convex.site/icon-512.png",
            "description": "Prevent the diseases that run in your family."
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Preventah needs JavaScript to show your household's day. The project and what it does are
      described at https://github.com/levithefirst/preventah-convex
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
