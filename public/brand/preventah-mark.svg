<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="Preventah">
  <!-- Offset blush plate: the same depth trick the windows use. -->
  <rect x="9" y="11" width="59" height="57" rx="14" fill="#E8B4B8" stroke="#141414" stroke-width="3"/>
  <!-- Cream window -->
  <rect x="4" y="6" width="59" height="57" rx="14" fill="#F6F1E8" stroke="#141414" stroke-width="3"/>
  <!-- Mint calendar stripe across the top, clipped to the window's radius -->
  <path d="M4 20 V20 A14 14 0 0 1 18 6 H49 A14 14 0 0 1 63 20 V22 H4 Z" fill="#B7D9C2"/>
  <path d="M4 22 H63" stroke="#141414" stroke-width="3"/>
  <!-- Calendar tabs -->
  <rect x="18" y="1" width="7" height="10" rx="3" fill="#F6F1E8" stroke="#141414" stroke-width="3"/>
  <rect x="42" y="1" width="7" height="10" rx="3" fill="#F6F1E8" stroke="#141414" stroke-width="3"/>
  <!-- Bold ink P, drawn as a path so no font has to load -->
  <path fill="#141414" fill-rule="evenodd"
        d="M23 30 H38 A10.5 10.5 0 0 1 38 51 H31 V58 H23 Z
           M31 37 V44 H37.5 A3.5 3.5 0 0 0 37.5 37 Z"/>
</svg>
